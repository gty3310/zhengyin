[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zhengyin"
version = "0.1.0"
description = "古文正音 CLI：为 AI Agent 准备的古文 TTS 定音预处理器（多音字/通假/破读的算法化校验与转换）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ti Guo" }]
keywords = ["classical-chinese", "tts", "pinyin", "tongjia", "cli", "agent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
zhengyin = "zhengyin.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhengyin = ["data/*.json"]
